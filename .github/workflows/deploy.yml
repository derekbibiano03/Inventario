name: Compilar y Publicar Actualizacion

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar NuGet
        run: dotnet restore

      # Publicación estándar (sin el parámetro de archivo único)
      - name: Compilar WPF Tradicional
        run: dotnet publish GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj --configuration Release -o ./publish

      - name: Comprimir carpeta de publicación
        run: Compress-Archive -Path ./publish/* -DestinationPath ./InventarioSetup.zip

      - name: Generar Tag dinamico
        id: tag
        run: |
          $tagName = "v1.0." + (Get-Date -Format 'yyyyMMddHHmmss')
          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ./InventarioSetup.zip
          tag_name: ${{ steps.tag.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}