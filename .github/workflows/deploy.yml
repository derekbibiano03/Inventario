name: Compilar y Publicar Actualizacion

# Se ejecuta automáticamente cada vez que haces push a la rama main
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Obtiene el código fuente desde GitHub
    - name: Checkout del código
      uses: actions/checkout@v3

    # 2. Configura el entorno de .NET
    - name: Configurar .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # 3. Restaura las dependencias del proyecto
    - name: Restaurar NuGet
      run: dotnet restore

    # 4. Compila y publica la aplicación en una carpeta
    - name: Compilar WPF
      run: dotnet publish Inventario.Desktop/Inventario.Desktop.csproj -c Release -o ./publish /p:PublishSingleFile=true /p:SelfContained=false

    # 5. Comprime la compilación en un ZIP
    - name: Comprimir ejecutable
      run: Compress-Archive -Path ./publish/* -DestinationPath ./InventarioSetup.zip

    # 6. Genera un Tag único basado en la fecha y hora para evitar errores de etiquetas duplicadas
    - name: Generar Tag dinamico
      id: tag
      run: echo "tag_name=v1.0.$(Get-Date -Format 'yyyyMMddHHmmss')" >> $env:GITHUB_OUTPUT

    # 7. Crea la Release pública en GitHub y sube el ZIP compilado
    - name: Publicar Release en GitHub
      uses: softprops/action-gh-release@v1
      with:
        files: ./InventarioSetup.zip
        tag_name: ${{ steps.tag.outputs.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}