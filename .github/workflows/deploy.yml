name: Compilar y Publicar Actualizacion

on:
  push:
    tags:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Obtiene el código fuente
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configura el entorno de .NET 10
    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. Restaura las dependencias del proyecto
    - name: Restaurar NuGet
      run: dotnet restore

    # 4. Compila y publica el ejecutable WPF respetando la versión definida en el .csproj
    - name: Compilar WPF
      run: dotnet publish GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj --configuration Release -o ./publish /p:PublishSingleFile=true /p:SelfContained=false

    # 5. Comprime la compilación creando una carpeta contenedora limpia
    - name: Comprimir ejecutable
      run: |
        New-Item -ItemType Directory -Force -Path ./temp_zip/InventarioDesktop
        Copy-Item -Recurse -Force ./publish/* ./temp_zip/InventarioDesktop/
        Compress-Archive -Path ./temp_zip/InventarioDesktop -DestinationPath ./InventarioSetup.zip

    # 6. Extraer automáticamente el Tag de la versión actual
    - name: Generar Tag de Version
      id: tag
      run: echo "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT

    # 7. Crea la Release en GitHub
    - name: Publicar Release en GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: ./InventarioSetup.zip
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: "Actualización ${{ steps.tag.outputs.tag_name }}"
        body: "Nueva actualización automática del sistema de inventarios y mantenimientos."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}